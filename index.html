<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183d35"><meta name="description" content="Find outdoor places near you in Sweden."><title>Sweden Outdoor Explorer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzxU1VZtC1d1e/SUHZxOetwQ=" crossorigin=""><link rel="stylesheet" href="./style.css"></head>
<body><header><div><strong>🌲 Sweden Outdoor Explorer</strong><small>Discover nature nearby</small></div><button id="locate" aria-label="Find my location">◎ Near me</button></header><main><section class="controls" aria-label="Search controls"><label for="place">Search area</label><div class="search"><input id="place" placeholder="e.g. Lund, Malmö, Stockholm" autocomplete="off"><button id="search">Search</button></div><div class="filters"><label>Within <select id="radius"><option value="3000">3 km</option><option value="7000" selected>7 km</option><option value="15000">15 km</option></select></label><label>Show <select id="kind"><option value="all">All places</option><option value="nature">Nature reserves</option><option value="water">Swimming spots</option><option value="view">Viewpoints</option></select></label><button id="refresh">Find places</button></div><p id="status" role="status" aria-live="polite">Choose a city or use your location to begin.</p></section><div id="map" role="application" aria-label="Interactive outdoor places map"></div><section class="results"><div class="results-head"><h2>Places <span id="count"></span></h2><button id="saved-toggle" aria-pressed="false">☆ Saved</button></div><div id="places" class="cards"><p class="empty">Nearby outdoor places will appear here.</p></div></section></main><footer>Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>. Places from OpenStreetMap via Overpass. Distances are straight-line estimates, not walking routes.</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="./app.js" defer></script></body></html>
