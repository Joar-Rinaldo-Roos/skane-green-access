name: Test Here & Now Temperature
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  temperature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check temperature and globe JavaScript
        run: |
          node --check temperature-core.js
          node --check temperature-layer.js
          node --check rain-forecast-core.js
          node --check rain-forecast.js
          node --check cloud-cover-core.js
          node --check cloud-cover.js
          node --check wind-core.js
          node --check wind-layer.js
          node --check weather-timeline-core.js
          node --check weather-timeline.js
          node --check weather-data-cache.js
          node --check globe-map-controller.js
          node --check tile-cache.js
          node --check weather-prefetch.js
          node --check first-frame-preload.js
          node --test first-frame-preload.test.cjs
          node --test weather-prefetch.test.cjs
          node --test globe-only.test.cjs
          node --check wind-smoke.mjs
          node --check cloud-cover-smoke.mjs
          node --check next-rain-core.js
          node --check next-rain.js
          node --check next-rain-smoke.mjs
          node --check rain-forecast-smoke.mjs
          node --check globe.js
          node --check temperature-smoke.mjs
      - name: Temperature geometry and timestamp unit tests
        run: node --test temperature.test.cjs temperature-sync.browser.test.cjs weather-composite.test.cjs rain-forecast.test.cjs rain-forecast.browser.test.cjs cloud-cover.test.cjs cloud-cover.browser.test.cjs wind.test.cjs wind.browser.test.cjs weather-timeline.test.cjs weather-timeline.browser.test.cjs weather-data-cache.test.cjs weather-prefetch.test.cjs first-frame-preload.test.cjs next-rain.test.cjs next-rain.browser.test.cjs
      - name: Verify release number and visible header contract
        run: node --test version.test.cjs
      - name: Inspect existing public Pages content
        run: |
          curl -fsSL --max-time 20 "https://joar-rinaldo-roos.github.io/skane-green-access/?inspect=${GITHUB_SHA}" -o /tmp/pages-live.html
          if grep -Fq 'data-app-version="1.0.10"' /tmp/pages-live.html && grep -Fq 'id="weather-play"' /tmp/pages-live.html; then echo "Live Pages already includes v1.0.10 first-frame preloading"; else echo "Live Pages is still serving an earlier release (expected until PR deploy)"; fi
      - name: Verify live global DWD ICON wind vector source and future hours
        run: node wind-smoke.mjs
      - name: Verify global Open-Meteo cloud cover variables and forecast horizon
        run: node cloud-cover-smoke.mjs
      - name: Verify hourly Open-Meteo rain + showers API with real coordinates
        run: node next-rain-smoke.mjs
      - name: Check live model metadata and weather renderer files
        run: node temperature-smoke.mjs
      - name: Verify live precipitation forecast variables and future time steps
        run: node rain-forecast-smoke.mjs
