name: Test Here & Now Green Spaces
on:
  push:
    branches: [main, feature/green-spaces-map-20261122]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax checks
        run: |
          node --check green-spaces-core.js
          node --check green-spaces.js
          node --check map.js
          node --check globe.js
          node --check app.js
      - name: Green-space geometry and query tests
        run: node --test green-spaces.test.cjs
