name: Test Here & Now Green Spaces
on:
  push:
    branches: [main, feature/green-spaces-map-20261122]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax checks
        run: |
          node --check green-spaces-core.js
          node --check green-spaces.js
          node --check map.js
          node --check globe.js
          node --check app.js
      - name: Fetch live OpenFreeMap TileJSON (network integration smoke test)
        run: |
          node --input-type=module -e 'const controller=new AbortController();const t=setTimeout(()=>controller.abort(),15000);try{const r=await fetch("https://tiles.openfreemap.org/planet/latest",{signal:controller.signal});if(!r.ok)throw Error("TileJSON HTTP "+r.status);const j=await r.json();if(!Array.isArray(j.tiles)||!j.tiles.length)throw Error("No tiles in TileJSON");console.log("OpenFreeMap TileJSON reachable; "+j.tiles.length+" tile URL templates")}finally{clearTimeout(t)}'
      - name: Green-space geometry and query tests
        run: node --test green-spaces.test.cjs green-vector.test.cjs
