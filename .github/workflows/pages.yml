name: Deploy Here & Now to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        run: |
          node --check temperature-core.js
          node --check temperature-layer.js
          node --check rain-forecast-core.js
          node --check rain-forecast.js
          node --check cloud-cover-core.js
          node --check cloud-cover.js
          node --test cloud-cover.test.cjs cloud-cover.browser.test.cjs
          node --check next-rain-core.js
          node --check next-rain.js
          node --test next-rain.test.cjs next-rain.browser.test.cjs
          node --test rain-forecast.test.cjs rain-forecast.browser.test.cjs
          node --test temperature.test.cjs temperature-sync.browser.test.cjs weather-composite.test.cjs
          node --test version.test.cjs
          node --check green-spaces-core.js
          node --check green-spaces.js
          node --test green-spaces.test.cjs green-vector.test.cjs
          node --check app.js
          node --check map.js
          node --check globe.js
          node --check globe-loader.mjs
          node --check diagnostics.js
          node --check soil-info.js
          node --check archive.js
          node --check nature-detail.js
          node --check local-history.js
          node --check sky.js
          node --check discovery-ui.js
          node --check chat.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage only public website assets
        run: |
          mkdir -p _site
          cp index.html version.json app.js temperature-core.js temperature-layer.js rain-forecast-core.js rain-forecast.js cloud-cover-core.js cloud-cover.js next-rain-core.js next-rain.js green-spaces-core.js green-spaces.js map.js globe.js globe-loader.mjs diagnostics.js soil-info.js archive.js nature-detail.js local-history.js sky.js discovery-ui.js chat.js style.css map.css _site/
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual published Pages release
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          expected=$(node -p "require('./version.json').version")
          site="${SITE_URL%/}/"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "${site}?release=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/here-now-live.html; then
              if grep -Fq "data-app-version=\"${expected}\"" /tmp/here-now-live.html && grep -Fq 'id="toggle-temperature"' /tmp/here-now-live.html && grep -Fq 'id="toggle-rain"' /tmp/here-now-live.html && grep -Fq 'id="next-rain-panel"' /tmp/here-now-live.html && grep -Fq 'id="toggle-clouds"' /tmp/here-now-live.html && grep -Fq 'id="cloud-opacity"' /tmp/here-now-live.html; then
                echo "Published website verified: v${expected}, with synchronized clouds and temperature controls"
                exit 0
              fi
            fi
            echo "The published website does not yet show v${expected}, temperature, rain, synchronized clouds and next rain controls (attempt ${attempt}/12)"
            sleep 10
          done
          echo "::error::GitHub Pages is not serving v${expected} with Temp, rain, cloud cover and next-rain controls. Check Pages deployment source and CDN."
          exit 1
