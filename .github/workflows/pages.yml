name: Deploy Here & Now to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        run: |
          node --check temperature-core.js
          node --check temperature-layer.js
          node --check rain-forecast-core.js
          node --check rain-forecast.js
          node --check cloud-cover-core.js
          node --check cloud-cover.js
          node --check wind-core.js
          node --check wind-layer.js
          node --check weather-timeline-core.js
          node --check weather-timeline.js
          node --check weather-data-cache.js
          node --test weather-data-cache.test.cjs
          node --test weather-timeline.test.cjs weather-timeline.browser.test.cjs
          node --test wind.test.cjs wind.browser.test.cjs
          node --test cloud-cover.test.cjs cloud-cover.browser.test.cjs
          node --check next-rain-core.js
          node --check next-rain.js
          node --test next-rain.test.cjs next-rain.browser.test.cjs
          node --test rain-forecast.test.cjs rain-forecast.browser.test.cjs
          node --test temperature.test.cjs temperature-sync.browser.test.cjs weather-composite.test.cjs
          node --test version.test.cjs
          node --check green-spaces-core.js
          node --check green-spaces.js
          node --test green-spaces.test.cjs green-vector.test.cjs
          node --check app.js
          node --check map.js
          node --check globe.js
          node --check globe-map-controller.js
          node --check tile-cache.js
          node --test globe-only.test.cjs
          node --check globe-loader.mjs
          node --check diagnostics.js
          node --check soil-info.js
          node --check archive.js
          node --check nature-detail.js
          node --check local-history.js
          node --check sky.js
          node --check discovery-ui.js
          node --check chat.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage only public website assets
        run: |
          mkdir -p _site
          cp index.html version.json app.js globe-map-controller.js tile-cache.js temperature-core.js temperature-layer.js rain-forecast-core.js rain-forecast.js cloud-cover-core.js cloud-cover.js wind-core.js wind-layer.js weather-timeline-core.js weather-timeline.js weather-data-cache.js next-rain-core.js next-rain.js green-spaces-core.js green-spaces.js globe.js globe-loader.mjs diagnostics.js soil-info.js archive.js nature-detail.js local-history.js sky.js discovery-ui.js chat.js style.css map.css _site/
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # Validate the deployment workflow's artifact handling as part of the
      # release gate. This test does not require external network access.
      - name: Validate Pages artifact visibility guard
        run: |
          node --test pages-workflow.test.cjs
      # Pages/Actions artifact APIs can briefly disagree after upload:
      # a successful upload may return "Found 0 artifacts" to deploy-pages.
      # Poll the official Actions API before letting deploy-pages resolve it.
      - name: Wait until Pages artifact is visible to Actions API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 20); do
            response=$(curl -fsSL --retry 2 --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")
            count=$(printf '%s' "$response" | node -e "let data='';process.stdin.on('data',c=>data+=c);process.stdin.on('end',()=>{const j=JSON.parse(data);console.log((j.artifacts||[]).filter(a=>a.name==='github-pages'&&!a.expired).length)})")
            if [ "$count" = 1 ]; then
              echo "One Pages artifact is visible to the Actions API."
              # The deploy-pages action queries a separate artifact service that can
              # lag the public Actions API by several seconds after upload.
              # Do not rerun this job: retries would create duplicate artifacts.
              echo "Giving GitHub Pages artifact services time to synchronize…"
              sleep 20
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple github-pages artifacts detected. Trigger a fresh workflow run, not a job rerun."
              exit 1
            fi
            echo "Pages artifact not yet indexed (attempt ${attempt}/20); retrying."
            sleep 6
          done
          echo "::error::The uploaded github-pages artifact was not indexed in time."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual published Pages release
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          expected=$(node -p "require('./version.json').version")
          site="${SITE_URL%/}/"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 -H "Cache-Control: no-cache" "${site}?release=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/here-now-live.html; then
              if grep -Fq "data-app-version=\"${expected}\"" /tmp/here-now-live.html && grep -Fq 'id="toggle-temperature"' /tmp/here-now-live.html && grep -Fq 'id="toggle-rain"' /tmp/here-now-live.html && grep -Fq 'id="next-rain-panel"' /tmp/here-now-live.html && grep -Fq 'id="toggle-clouds"' /tmp/here-now-live.html && grep -Fq 'id="cloud-opacity"' /tmp/here-now-live.html && grep -Fq 'id="cloud-with-temperature"' /tmp/here-now-live.html && grep -Fq 'id="toggle-wind"' /tmp/here-now-live.html && grep -Fq 'id="weather-play"' /tmp/here-now-live.html && grep -Fq 'id="weather-hour"' /tmp/here-now-live.html && grep -Fq 'weather-data-cache.js?v=1' /tmp/here-now-live.html && grep -Fq 'globe-map-controller.js?v=1' /tmp/here-now-live.html && grep -Fq 'tile-cache.js?v=1' /tmp/here-now-live.html && grep -Fq 'id="tile-cache-extra"' /tmp/here-now-live.html && ! grep -Fq 'id="toggle-globe"' /tmp/here-now-live.html; then
                echo "Published website verified: v${expected}, globe-only map and configurable larger tile cache"
                exit 0
              fi
            fi
            echo "The published website does not yet show v${expected}, temperature, rain, wind, optional clouds and next rain controls (attempt ${attempt}/12)"
            sleep 10
          done
          echo "::error::GitHub Pages is not serving v${expected} with Temp, rain, cloud cover and next-rain controls. Check Pages deployment source and CDN."
          exit 1
